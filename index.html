<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon / Ícono de la pestaña con ID dinámico -->
    <link id="pagina-icono" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">
    
    <style>
      /* Reseteo general */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #050505; /* Fondo casi negro para contraste de neón */
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }

      /* Contenedor general */
      .contenedor {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* Estilos para el iframe a pantalla completa */
      #webApp {
        width: 100%;
        height: 100vh;
        border: none;
      }

      /* Estilo de Error 404 con efecto Neón Rojo */
      .error-container {
        text-align: center;
        position: relative;
        padding: 20px;
      }

      /* Líneas horizontales de fondo estilo láser */
      .error-container::before,
      .error-container::after {
        content: "";
        position: absolute;
        left: -50vw;
        right: -50vw;
        height: 3px;
        background-color: #ff0033;
        box-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 40px #ff0033;
        z-index: -1;
      }

      .error-container::before {
        top: 30%;
      }

      .error-container::after {
        bottom: 30%;
      }

      .error-code {
        font-size: 75px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
        text-transform: uppercase;
        /* Efecto de resplandor de neón (glow) */
        text-shadow: 
          0 0 5px #fff, 
          0 0 10px #fff, 
          0 0 20px #ff0033, 
          0 0 40px #ff0033, 
          0 0 80px #ff0033;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 16px;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 10px;
      }
    </style>
    <!-- Título inicial por defecto -->
    <title id="pagina-titulo">Ingenius Cloud</title>
</head>
<body>
    <div class="contenedor" id="contenedor-principal">
        <!-- El contenido se cargará dinámicamente aquí -->
    </div>

    <script>
        // 1. Capturamos los parámetros de la URL
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const paramId = urlParams.get('id');

        // 2. Diccionario de enlaces permitidos (con las llaves exactas originales)
        const enlacesIframes = {
            "now": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "anur": "https://script.google.com/macros/s/AKfycby6OHYbTpxqvJw0IhkbsBIe_20edqPBwcULeZ8n63SOJsfxy0Nzondt872vMf1X_uJv/exec",
            "gnur": "https://script.google.com/macros/s/AKfycbwIHo7BvvtUhEgrKvZq74pgZ01ZiBQRyvcykVJKrRhVYBn_ARqaI2bkCB-lV3IpY4rs/exec",
            "hnur": "https://script.google.com/macros/s/AKfycbzfSvI-q6hEt6CnUaD4F7uNsNeb6gHiT8b-_sL3BuD6yhIftUqobw-aIda0FwZHO8En/exec",
            "anav": "https://script.google.com/macros/s/AKfycbyitrKOrBA5o0M_oSFQ7m-sKfwX2TQ6q_Qm6ZcKq3xbtqGj-z_oZ7Rl8USbn7Efohy8/exec",
            "qr": "https://script.google.com/macros/s/AKfycbzkj62VqPsk8TAmygWlAyImYsA_GLlPGhpM6UjRQPnBOotSzC-QBRYC7UQNtudCgIPuOg/exec",
            "land": "https://script.google.com/macros/s/AKfycbz4Zi0AgMxzSJ95spG1c7-g8lRV8odd7KP3OFFfd9D2sjwNZTevjH7fbSWf8eGXkGv4gQ/exec",
            "SaaS": "https://script.google.com/macros/s/AKfycbxSvQlqG29OqfZhzbMWUhkljrP7gLUuo-cqp-E5GjaNYsih9PnttfA0WEKH8hnj7Mpxzg/exec",
            
            "cvd": "https://ingeniuscloud.github.io/cv.dev/"
        };

        // 3. Diccionario de títulos personalizados según el ID
        const titulosPagina = {
            "now": "Formulario Now Moving",
            "anur": "Consultorio Sonrisalud",
            "gnur": "Consultorio Sonrisalud",
            "hnur": "Consultorio Sonrisalud",
            "anav": "Gestion Almacén",
            "qr": "Generador QR Pro",
            "land": "INGenius Cloud",
            "SaaS": "INGenius Cloud",
            
            "cvd": "CV Jesús Aguilera Dev"
        };

        // 4. Diccionario de iconos personalizados según el ID
        const iconosPagina = {
            "now": "📦",
            "anur": "🦷",
            "gnur": "🦷",
            "hnur": "🦷",
            "anav": "📦",
            "qr": "📳",
            "land": "ℹ️",
            "SaaS": "ℹ️",
            
            "cvd": "🆔"
        };

        const contenedor = document.getElementById('contenedor-principal');
        const elementoTitulo = document.getElementById('pagina-titulo');
        const elementoIcono = document.getElementById('pagina-icono');

        // Función auxiliar para generar la URL del favicon con SVG y emoji
        function crearFaviconSvg(emoji) {
            return `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>${emoji}</text></svg>`;
        }

        // 5. Validación, renderizado dinámico y actualización del título y favicon de la pestaña
        if (paramId && enlacesIframes[paramId]) {
            contenedor.innerHTML = `<iframe id="webApp" src="${enlacesIframes[paramId]}"></iframe>`;
            elementoTitulo.innerText = titulosPagina[paramId] || paramId;
            
            // Asigna el icono correspondiente o uno por defecto si no estuviera registrado
            const iconoSeleccionado = iconosPagina[paramId] || "🧩";
            elementoIcono.href = crearFaviconSvg(iconoSeleccionado);
        } else {
            elementoTitulo.innerText = "Ingenius Cloud";
            elementoIcono.href = crearFaviconSvg("🧩");
            contenedor.innerHTML = `
                <div class="error-container">
                    <div class="error-code">ERROR 404</div>
                    <div class="error-message">Acceso no válido o enlace incompleto</div>
                </div>
            `;
        }
    </script>
</body>
</html>
