<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <link id="pagina-icono" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #050505;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .contenedor {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      #webApp {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: none;
        display: block;
      }

      .error-container {
        text-align: center;
        position: relative;
        padding: 20px;
      }

      .error-container::before,
      .error-container::after {
        content: "";
        position: absolute;
        left: -50vw;
        right: -50vw;
        height: 3px;
        background-color: #ff0033;
        box-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 40px #ff0033;
        z-index: -1;
      }

      .error-container::before { top: 30%; }
      .error-container::after { bottom: 30%; }

      .error-code {
        font-size: 75px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
        text-transform: uppercase;
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #ff0033,
          0 0 40px #ff0033,
          0 0 80px #ff0033;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 16px;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 10px;
      }
    </style>

    <title id="pagina-titulo">Ingenius Cloud</title>
</head>
<body>
    <div class="contenedor" id="contenedor-principal"></div>

    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const paramId = urlParams.get('id');

        const enlacesIframes = {
            "now": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "anur": "https://script.google.com/macros/s/AKfycby6OHYbTpxqvJw0IhkbsBIe_20edqPBwcULeZ8n63SOJsfxy0Nzondt872vMf1X_uJv/exec",
            "gnur": "https://script.google.com/macros/s/AKfycbwIHo7BvvtUhEgrKvZq74pgZ01ZiBQRyvcykVJKrRhVYBn_ARqaI2bkCB-lV3IpY4rs/exec",
            "hnur": "https://script.google.com/macros/s/AKfycbzfSvI-q6hEt6CnUaD4F7uNsNeb6gHiT8b-_sL3BuD6yhIftUqobw-aIda0FwZHO8En/exec",
            "anav": "https://script.google.com/macros/s/AKfycbzLMAnDna9-BJwxGK3WoV7hx1qjTcRWHmmcGRFyqc8P8roY1gvBFSavPE4ZZ4fxraSK/exec",
            "qr": "https://script.google.com/macros/s/AKfycbzkj62VqPsk8TAmygWlAyImYsA_GLlPGhpM6UjRQPnBOotSzC-QBRYC7UQNtudCgIPuOg/exec",
            "land": "https://script.google.com/macros/s/AKfycbz4Zi0AgMxzSJ95spG1c7-g8lRV8odd7KP3OFFfd9D2sjwNZTevjH7fbSWf8eGXkGv4gQ/exec",
            "SaaS": "https://script.google.com/macros/s/AKfycbwIrvKzuQTq8jIbSPRFirta0mal48ya1NPAxVxn5T0sbtPOTm1YvdCjy4fDVUFjGLhZ4A/exec",
            "main": "https://script.google.com/macros/s/AKfycbwow_aMUByYgG1TxtNAQ1eGDnnyAXRWfBPjHFkQQJjuRvCHmDWltT2-x5mu_rluBgnhLg/exec",
            "clas": "https://script.google.com/macros/s/AKfycby6mJpXKamGHPfn9AQwQ6p7H5yfH0B1pU1jO56ZvjMe8xeO_f_RsSUoXMUQd9TJ74MUhw/exec",
            "cvd": "https://ingeniuscloud.github.io/cv.dev/"
        };

        const titulosPagina = {
            "now": "Formulario Now Moving",
            "anur": "Consultorio Sonrisalud",
            "gnur": "Consultorio Sonrisalud",
            "hnur": "Consultorio Sonrisalud",
            "anav": "Gestion Almacén",
            "qr": "Generador QR Pro",
            "land": "INGenius Cloud",
            "SaaS": "INGenius Cloud",
            "main": "INGenius Cloud",
            "clas": "Centro Ceicca",
            "cvd": "CV Jesús Aguilera Dev"
        };

        const iconosPagina = {
            "now": "📦",
            "anur": "🦷",
            "gnur": "🦷",
            "hnur": "🦷",
            "anav": "📦",
            "qr": "📳",
            "land": "ℹ️",
            "SaaS": "ℹ️",
            "main": "ℹ️",
            "clas": "ℹ️",
            "cvd": "🆔"
        };

        const contenedor = document.getElementById('contenedor-principal');
        const elementoTitulo = document.getElementById('pagina-titulo');
        const elementoIcono = document.getElementById('pagina-icono');

        function crearFaviconSvg(emoji) {
            return `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>${emoji}</text></svg>`;
        }

        if (paramId && enlacesIframes[paramId]) {
            // IFRAME CON PERMISOS EXPLÍCITOS
            // Sin estos allow, se bloquean navigator.share, clipboard, vibrate, etc.
            contenedor.innerHTML = `<iframe
                id="webApp"
                src="${enlacesIframes[paramId]}"
                allow="web-share; clipboard-write; clipboard-read; vibrate; autoplay; fullscreen; geolocation"
                referrerpolicy="no-referrer-when-downgrade"
                loading="eager"
            ></iframe>`;

            elementoTitulo.innerText = titulosPagina[paramId] || paramId;

            const iconoSeleccionado = iconosPagina[paramId] || "🧩";
            elementoIcono.href = crearFaviconSvg(iconoSeleccionado);
        } else {
            elementoTitulo.innerText = "Ingenius Cloud";
            elementoIcono.href = crearFaviconSvg("🧩");
            contenedor.innerHTML = `
                <div class="error-container">
                    <div class="error-code">ERROR 404</div>
                    <div class="error-message">Acceso no válido o enlace incompleto</div>
                </div>
            `;
        }
    </script>
</body>
</html>
