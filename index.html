<!DOCTYPE html>
<!--
* ══════════════════════════════════════════════════════════════
* ARCHIVO:         Index_GitHub.html (subir a GitHub Pages como index.html)
* PROYECTO:        INGeniusCloud | Envoltorio de apps (GitHub Pages)
* RESPONSABILIDAD: Página envoltorio: elige la app por ?id=, muestra
*                  el preloader orbital mientras carga el iframe y
*                  luego lo oculta. El texto central, el ícono, el
*                  título y el color de barras cambian por app.
* VERSIÓN:         1.4
* CAMBIOS:         R57 (el preloader ya no se retira al `iframe.load`,
*                  sino cuando la app emite postMessage('app-lista').
*                  Esto garantiza que el usuario no vea un flash
*                  blanco entre que el iframe carga y la app pinta.
*                  Fallback: si la app no avisa en 5 seg tras load,
*                  el preloader se retira igual).
* DEPENDENCIAS:    Despliegue: GitHub Pages. Apps: enlacesIframes;
*                  textos centrales: textoCentral; íconos: iconosPagina;
*                  títulos: titulosPagina; colores: coloresBarras.
*                  La app debe emitir postMessage({tipo:'app-lista'}).
* ══════════════════════════════════════════════════════════════
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <!-- ═══ COLOR DE LAS BARRAS DEL TELÉFONO ═══
         Esta meta theme-color tiñe las barras en los navegadores de
         Android (Chrome/Samsung). En iPhone las barras se tiñen con el
         FONDO de esta página, así que el color por app se aplica en el
         mapa coloresBarras (más abajo, en el script), que pinta AMBOS.
         Valor por defecto: el fondo de esta página (#050505), igual que
         siempre. -->
    <meta name="theme-color" content="#050505">

    <link id="pagina-icono" rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌐</text></svg>">

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: #050505;
        color: #f8fafc;
        display: flex;
        justify-content: center;
        align-items: stretch;
      }

      .contenedor {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: stretch;
        position: relative;
      }

      #webApp {
        width: 100%;
        height: 100%;
        border: none;
        display: block;
      }

      /* ═══════════════════════════════════════════════════════
         PRELOADER ORBITAL · overlay sobre el contenedor
         ═══════════════════════════════════════════════════════ */
      .preloader-overlay {
        position: absolute;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        opacity: 1;
        transition: opacity 0.32s ease;
        pointer-events: none;
      }
      .preloader-overlay.saliendo { opacity: 0; }
      .preloader-overlay[hidden]  { display: none; }

      .carga-preloader {
        --text-primary: #0f172a;
        --text-muted: #64748b;
        --border-input: #cbd5e1;
        --logo-primario: #00A3E0;
        --logo-secundario: #0EA5E9;

        display: inline-flex;
        flex-direction: column;
        align-items: center;
      }

      @keyframes rot { to { transform: rotate(360deg); } }

      .carga-loader {
        position: relative;
        width: 100px;
        height: 100px;
      }

      .carga-orbital {
        position: absolute;
        border-radius: 50%;
        border: 1px solid color-mix(in srgb, var(--border-input) 80%, transparent);
      }

      .carga-orbital-1 {
        inset: 0;
        border-top-color: var(--logo-primario);
        border-right-color: var(--logo-primario);
        animation: rot 1.6s linear infinite;
      }

      .carga-orbital-2 {
        inset: 12px;
        border-bottom-color: var(--logo-secundario);
        border-left-color: var(--logo-secundario);
        animation: rot 1.2s linear infinite reverse;
      }

      .carga-core {
        position: absolute;
        width: 48px;
        height: 48px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .carga-core span {
        font-size: 22px;
        font-weight: 400;
        letter-spacing: -0.5px;
        color: var(--logo-primario);
        animation: cargaPulso 2s ease-in-out infinite;
      }

      .carga-brand {
        margin-top: 25px;
        font-size: 21px;
        letter-spacing: -0.6px;
        color: var(--text-primary);
        display: inline-flex;
        align-items: baseline;
      }

      .carga-brand-in     { color: var(--logo-primario);   font-weight: 900; }
      .carga-brand-genius { color: var(--text-primary);    font-weight: 700; }
      .carga-brand-cloud  { color: var(--logo-secundario); font-weight: 300; letter-spacing: 1px; margin-left: 1px; }

      .carga-status {
        margin-top: 9px;
        font-size: 12px;
        letter-spacing: 0.3px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
      }

      .carga-puntos {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
      }

      .carga-puntos span {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--logo-primario);
        animation: cargaPunto 1.4s infinite;
      }
      .carga-puntos span:nth-child(2) { animation-delay: 0.2s; }
      .carga-puntos span:nth-child(3) { animation-delay: 0.4s; }

      @keyframes cargaPunto {
        0%, 100% { opacity: 0.2; transform: translateY(0); }
        50%      { opacity: 1;   transform: translateY(-3px); }
      }
      @keyframes cargaPulso {
        0%, 100% { transform: scale(0.92); opacity: 0.65; }
        50%      { transform: scale(1);    opacity: 1; }
      }

      /* ═══════════════════════════════════════════════════════
         PANTALLA 404
         ═══════════════════════════════════════════════════════ */
      .error-container {
        text-align: center;
        position: relative;
        padding: 20px;
      }

      .error-container::before,
      .error-container::after {
        content: "";
        position: absolute;
        left: -50vw;
        right: -50vw;
        height: 3px;
        background-color: #ff0033;
        box-shadow: 0 0 10px #ff0033, 0 0 20px #ff0033, 0 0 40px #ff0033;
        z-index: -1;
      }

      .error-container::before { top: 30%; }
      .error-container::after { bottom: 30%; }

      .error-code {
        font-size: 75px;
        font-weight: 800;
        letter-spacing: 2px;
        color: #ffffff;
        text-transform: uppercase;
        text-shadow:
          0 0 5px #fff,
          0 0 10px #fff,
          0 0 20px #ff0033,
          0 0 40px #ff0033,
          0 0 80px #ff0033;
        margin-bottom: 15px;
      }

      .error-message {
        font-size: 16px;
        color: #94a3b8;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-top: 10px;
      }
    </style>

    <title id="pagina-titulo">Ingenius Cloud</title>
</head>
<body>
    <div class="contenedor" id="contenedor-principal"></div>

    <script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const paramId = urlParams.get('id');

        const enlacesIframes = {
            "now": "https://script.google.com/macros/s/AKfycbyPYl8OHgF-RIhXJkQS7BUv7KAqw9EYlXSG7e5Eh5csqXe353CN5-W-p9chC4372FBC/exec",
            "anur": "https://script.google.com/macros/s/AKfycby6OHYbTpxqvJw0IhkbsBIe_20edqPBwcULeZ8n63SOJsfxy0Nzondt872vMf1X_uJv/exec",
            "gnur": "https://script.google.com/macros/s/AKfycbwIHo7BvvtUhEgrKvZq74pgZ01ZiBQRyvcykVJKrRhVYBn_ARqaI2bkCB-lV3IpY4rs/exec",
            "hnur": "https://script.google.com/macros/s/AKfycbzfSvI-q6hEt6CnUaD4F7uNsNeb6gHiT8b-_sL3BuD6yhIftUqobw-aIda0FwZHO8En/exec",
            "anav": "https://script.google.com/macros/s/AKfycbzLMAnDna9-BJwxGK3WoV7hx1qjTcRWHmmcGRFyqc8P8roY1gvBFSavPE4ZZ4fxraSK/exec",
            "qr": "https://script.google.com/macros/s/AKfycbzkj62VqPsk8TAmygWlAyImYsA_GLlPGhpM6UjRQPnBOotSzC-QBRYC7UQNtudCgIPuOg/exec",
            "land": "https://script.google.com/macros/s/AKfycbz4Zi0AgMxzSJ95spG1c7-g8lRV8odd7KP3OFFfd9D2sjwNZTevjH7fbSWf8eGXkGv4gQ/exec",
            "SaaS": "https://script.google.com/macros/s/AKfycbwIrvKzuQTq8jIbSPRFirta0mal48ya1NPAxVxn5T0sbtPOTm1YvdCjy4fDVUFjGLhZ4A/exec",
            "main": "https://script.google.com/macros/s/AKfycbwow_aMUByYgG1TxtNAQ1eGDnnyAXRWfBPjHFkQQJjuRvCHmDWltT2-x5mu_rluBgnhLg/exec",
            "lead": "https://script.google.com/macros/s/AKfycbx930qsfOBKNs0lqh90To5GrluqNWIBeYa85zSyJSc7CvYBrF2DSyzjs38Cd7jwFMJTIg/exec",
            "clas": "https://script.google.com/macros/s/AKfycbxBZDPI6pMjmFp_C6CdyHbmCnlWKdf3QZblQVVMfUKVN-1KGnahy6tc9_o7kCZ_MJ1maw/exec",

            "cvd": "https://ingeniuscloud.github.io/cv.dev/"
        };

        const titulosPagina = {
            "now": "Formulario Now Moving",
            "anur": "Consultorio Sonrisalud",
            "gnur": "Consultorio Sonrisalud",
            "hnur": "Consultorio Sonrisalud",
            "anav": "Gestion Almacén",
            "qr": "Generador QR Pro",
            "land": "INGenius Cloud",
            "SaaS": "INGenius Cloud",
            "main": "INGenius Cloud",
            "lead": "Centro Ceicca",
            "clas": "Centro Ceicca",

            "cvd": "CV Jesús Aguilera Dev"
        };

        const iconosPagina = {
            "now": "📦",
            "anur": "🦷",
            "gnur": "🦷",
            "hnur": "🦷",
            "anav": "📦",
            "qr": "📳",
            "land": "ℹ️",
            "SaaS": "ℹ️",
            "main": "ℹ️",
            "clas": "ℹ️",
            "lead": "ℹ️",

            "cvd": "🆔"
        };

        // ═══ TEXTO CENTRAL DEL PRELOADER POR APP ═══
        // Es el texto que aparece dentro del círculo del preloader.
        // Las apps sin línea aquí muestran "Ceicca" por defecto.
        // PARA CAMBIAR EL TEXTO A FUTURO: edita el valor de la app
        // o añade una línea nueva "id": "Texto".
        const textoCentral = {
            "lead": "Cursos",
            "clas": "Cursos",
            "now":  "SaaS",
            "anur": "SaaS",
            "gnur": "SaaS",
            "hnur": "SaaS",
            "anav": "SaaS",
            "qr":   "QR",
            "land": "SaaS",
            "SaaS": "SaaS",
            "main": "SaaS",

            "cvd":  "ING"
        };

        // ═══ TEXTO DE ESTADO DEL PRELOADER POR APP (opcional) ═══
        // Si no se define, se usa "Cargando" como texto por defecto.
        const estadoPorApp = {
            "lead": "Cargando catálogo",
            "clas": "Cargando catálogo"
        };

        // ═══ COLOR DE BARRAS POR APP ═══
        // Tiñe las barras del navegador (barra de direcciones y zona
        // inferior) con el color de cada app para que la pantalla se vea
        // completa y sin franjas negras. Al cargar la app, con este color
        // se pintan DOS cosas: el FONDO de esta página (así lo leen
        // Safari de iPhone y el resto) y la meta theme-color (así lo
        // leen Chrome y Samsung de Android). Las apps sin línea aquí
        // quedan en el #050505 de siempre.
        // PARA CAMBIAR EL COLOR A FUTURO: edita el hexadecimal de la app
        // o añade una línea nueva "id": "#hexadecimal".
        const coloresBarras = {
            "lead": "#f8fafc",
            "clas": "#f8fafc"
        };

        const contenedor = document.getElementById('contenedor-principal');
        const elementoTitulo = document.getElementById('pagina-titulo');
        const elementoIcono = document.getElementById('pagina-icono');

        function crearFaviconSvg(emoji) {
            return `data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>${emoji}</text></svg>`;
        }

        // Devuelve el nodo del preloader orbital con el texto central y
        // el estado ya inyectados.
        function crearPreloader(textoCentralTxt, textoEstado) {
            var wrap = document.createElement('div');
            wrap.className = 'preloader-overlay';
            wrap.innerHTML =
                '<div class="carga-preloader" role="status" aria-live="polite">' +
                    '<div class="carga-loader">' +
                        '<div class="carga-orbital carga-orbital-1"></div>' +
                        '<div class="carga-orbital carga-orbital-2"></div>' +
                        '<div class="carga-core"><span></span></div>' +
                    '</div>' +
                    '<div class="carga-brand">' +
                        '<span class="carga-brand-in">IN</span>' +
                        '<span class="carga-brand-genius">Genius</span>' +
                        '<span class="carga-brand-cloud">Cloud</span>' +
                    '</div>' +
                    '<div class="carga-status">' +
                        '<span class="carga-status-texto"></span>' +
                        '<span class="carga-puntos"><span></span><span></span><span></span></span>' +
                    '</div>' +
                '</div>';

            wrap.querySelector('.carga-core span').textContent = textoCentralTxt || 'Ceicca';
            wrap.querySelector('.carga-status-texto').textContent = textoEstado || 'Cargando';

            return wrap;
        }

        if (paramId && enlacesIframes[paramId]) {

            // 1. Preloader + iframe apilados dentro del contenedor
            const preloader = crearPreloader(
                textoCentral[paramId] || 'Ceicca',
                estadoPorApp[paramId] || 'Cargando'
            );

            contenedor.innerHTML = `<iframe
                id="webApp"
                src="${enlacesIframes[paramId]}"
                allow="web-share; clipboard-write; clipboard-read; vibrate; autoplay; fullscreen; geolocation"
                referrerpolicy="no-referrer-when-downgrade"
                loading="eager"
                style="opacity:0; transition:opacity 0.3s ease;"
            ></iframe>`;

            contenedor.appendChild(preloader);

            // 2. Metadatos de la app
            elementoTitulo.innerText = titulosPagina[paramId] || paramId;

            const iconoSeleccionado = iconosPagina[paramId] || "🧩";
            elementoIcono.href = crearFaviconSvg(iconoSeleccionado);

            // 3. Color de barras (fondo + theme-color)
            if (coloresBarras[paramId]) {
                const colorBarras = coloresBarras[paramId];
                document.documentElement.style.backgroundColor = colorBarras;
                document.body.style.backgroundColor = colorBarras;
                const metaColor = document.querySelector('meta[name="theme-color"]');
                if (metaColor) { metaColor.content = colorBarras; }
            }

            // 4. Retiro del preloader · espera el aviso de la app
            const iframe = document.getElementById('webApp');
            let preloaderRetirado = false;

            function retirarPreloader() {
                if (preloaderRetirado) return;
                preloaderRetirado = true;

                // Mostrar el iframe con fade
                iframe.style.opacity = '1';

                // Retirar el preloader con fade
                preloader.classList.add('saliendo');
                setTimeout(function () {
                    if (preloader.parentNode) preloader.parentNode.removeChild(preloader);
                }, 340);
            }

            // Ruta normal: la app avisa cuando terminó de pintar
            window.addEventListener('message', function (e) {
                if (e.data && e.data.tipo === 'app-lista') {
                    retirarPreloader();
                }
            });

            // Fallback de seguridad: si la app no avisa en 5 seg tras el
            // evento load, se retira igual para no dejar el preloader fijo.
            iframe.addEventListener('load', function () {
                setTimeout(retirarPreloader, 5000);
            });

        } else {
            elementoTitulo.innerText = "Ingenius Cloud";
            elementoIcono.href = crearFaviconSvg("🧩");
            contenedor.innerHTML = `
                <div class="error-container">
                    <div class="error-code">ERROR 404</div>
                    <div class="error-message">Acceso no válido o enlace incompleto</div>
                </div>
            `;
        }
    </script>
</body>
</html>
